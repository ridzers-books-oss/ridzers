<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>R.N</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Playfair+Display:ital,wght@0,600;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <!-- PDF.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <!-- JSZip (Required for EPUB extraction) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <!-- ePub.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/epubjs@0.3.93/dist/epub.min.js"></script>

    <style>
        .font-cinzel { font-family: 'Cinzel', serif; }
        .font-playfair { font-family: 'Playfair Display', serif; }
        .font-sans { font-family: 'Inter', sans-serif; }

        .spine-text-vertical {
            writing-mode: vertical-rl;
            transform: rotate(0deg);
            white-space: nowrap;
        }

        .wood-shelf {
            background: linear-gradient(180deg, #52270c 0%, #381805 60%, #1f0b02 100%);
            box-shadow: 0 14px 28px rgba(0,0,0,0.85), inset 0 2px 4px rgba(255, 255, 255, 0.15), inset 0 -3px 6px rgba(0,0,0,0.9);
            border-bottom: 2px solid #140601;
            border-radius: 2px;
        }
        .shelf-shadow {
            background: linear-gradient(180deg, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.3) 50%, transparent 100%);
        }
        .wood-background {
            background-color: #120904;
            background-image: 
                radial-gradient(circle at 50% 30%, rgba(70, 35, 12, 0.4) 0%, rgba(10, 5, 2, 0.95) 85%),
                linear-gradient(to right, rgba(0,0,0,0.8), rgba(0,0,0,0) 20%, rgba(0,0,0,0) 80%, rgba(0,0,0,0.8));
        }

        .cubby-container {
            background-color: #1a0f08;
            border: 2px solid #381805;
            box-shadow: inset 0 8px 16px rgba(0,0,0,0.9);
        }

        .shelf-container {
            perspective: 1200px;
        }

        .book-spine {
            transition: all 0.35s cubic-bezier(0.25, 1, 0.5, 1);
            transform-style: preserve-3d;
            cursor: pointer;
            position: relative;
            box-shadow: -4px 0 10px rgba(0,0,0,0.6), inset 2px 0 4px rgba(255,255,255,0.15), inset -2px 0 4px rgba(0,0,0,0.7);
        }

        .book-spine::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(90deg, 
                rgba(255,255,255,0.18) 0%, 
                rgba(255,255,255,0) 10%, 
                rgba(0,0,0,0.15) 20%, 
                rgba(255,255,255,0.05) 50%, 
                rgba(0,0,0,0.2) 85%, 
                rgba(0,0,0,0.5) 100%);
            pointer-events: none;
            border-radius: inherit;
        }

        .spine-ridge {
            position: absolute;
            left: 0; right: 0;
            height: 3px;
            background: linear-gradient(180deg, rgba(255,255,255,0.3) 0%, rgba(0,0,0,0.8) 100%);
            box-shadow: 0 1px 2px rgba(0,0,0,0.9);
        }

        .book-spine:hover {
            transform: translateY(-22px) scale(1.04) translateZ(30px) rotateY(-4deg);
            box-shadow: -10px 25px 30px rgba(0,0,0,0.9), 0 0 20px rgba(217, 119, 6, 0.4);
        }

        /* Prevent side clipping and enable unified smooth vertical scrolling for EPUB containers */
        #epubContainer, #epubViewerArea, [id^="epubjs-container-"], .epub-container {
            overflow-x: hidden !important;
            overflow-y: auto !important;
            max-width: 100% !important;
            width: 100% !important;
            height: 100% !important;
            box-sizing: border-box !important;
            scrollbar-width: none !important;
            -ms-overflow-style: none !important;
        }
        
        #epubContainer::-webkit-scrollbar,
        #epubViewerArea::-webkit-scrollbar,
        [id^="epubjs-container-"]::-webkit-scrollbar,
        .epub-container::-webkit-scrollbar {
            display: none !important;
            width: 0px !important;
            height: 0px !important;
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0a0502; }
        ::-webkit-scrollbar-thumb { background: #381805; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #52270c; }
    </style>
</head>
<body id="bodyRoot" class="bg-slate-950 text-slate-100 min-h-screen font-sans antialiased overflow-x-hidden wood-background selection:bg-amber-800 selection:text-white">

    <div id="app" class="min-h-screen flex flex-col justify-between relative">

        <!-- Top Header Navigation Bar -->
        <header class="w-full bg-black/80 backdrop-blur-md border-b border-amber-900/40 px-4 md:px-6 py-4 flex justify-between items-center z-50 sticky top-0 shadow-lg">
            <div class="flex items-center space-x-3">
                <div id="headerLogoBox" class="w-10 h-10 rounded-lg bg-amber-950 border border-amber-700/50 flex items-center justify-center shadow-md">
                    <i id="headerLogoIcon" class="fa-solid fa-book-bookmark text-amber-500 text-xl"></i>
                </div>
                <div>
                    <h1 id="headerTitle" class="text-lg md:text-2xl font-bold font-cinzel tracking-wider bg-gradient-to-r from-amber-100 via-amber-300 to-amber-600 bg-clip-text text-transparent">
                        THE ARCHIVE
                    </h1>
                </div>
            </div>
            
            <div class="flex items-center space-x-3">
                <button id="fullscreenBtn" onclick="toggleFullScreen()" class="p-2.5 px-4 rounded-lg bg-amber-950/70 hover:bg-amber-900 border border-amber-700/50 text-amber-200 transition-all duration-200 flex items-center space-x-2 text-sm font-medium shadow-md">
                    <i id="fullscreenIcon" class="fa-solid fa-expand text-amber-400"></i>
                    <span id="fullscreenText" class="hidden sm:inline">Fullscreen</span>
                </button>
            </div>
        </header>

        <main id="bookshelfView" class="container mx-auto px-4 py-8 flex-1 flex flex-col justify-center transition-opacity duration-500 z-10">
            <div class="text-center mb-8">
                <h2 id="mainHeading" class="text-3xl md:text-4xl font-cinzel font-bold text-amber-100 tracking-wide mb-2 drop-shadow-md">Books</h2>
            </div>

            <!-- Library Bookshelf Grid -->
            <div class="max-w-4xl mx-auto w-full space-y-12 py-4">
                <!-- Shelf Row 1 -->
                <div class="relative">
                    <div id="shelfRow1Container" class="cubby-container p-4 md:p-6 pb-2 min-h-[220px] flex items-end rounded-t-lg">
                        <div id="shelfRow1" class="w-full flex flex-wrap justify-center sm:justify-around items-end px-1 sm:px-2 shelf-container gap-3 sm:gap-4 md:gap-0"></div>
                    </div>
                    <div class="wood-shelf h-8 w-full rounded-sm flex items-center justify-between px-4 mt-1">
                        <div class="w-full h-1 bg-amber-950/40"></div>
                    </div>
                    <div class="shelf-shadow h-8 w-full"></div>
                </div>

                <!-- Shelf Row 2 -->
                <div class="relative">
                    <div id="shelfRow2Container" class="cubby-container p-4 md:p-6 pb-2 min-h-[220px] flex items-end rounded-t-lg">
                        <div id="shelfRow2" class="w-full flex flex-wrap justify-center sm:justify-around items-end px-1 sm:px-2 shelf-container gap-3 sm:gap-4 md:gap-0"></div>
                    </div>
                    <div class="wood-shelf h-8 w-full rounded-sm flex items-center justify-between px-4 mt-1">
                        <div class="w-full h-1 bg-amber-950/40"></div>
                    </div>
                    <div class="shelf-shadow h-8 w-full"></div>
                </div>
            </div>
        </main>

        <div id="readerView" class="fixed inset-0 bg-black z-50 hidden flex-col transition-all duration-300">
            
            <!-- E-Reader Top Bar Navigation -->
            <div id="readerHeader" class="w-full bg-zinc-950/90 backdrop-blur border-b border-zinc-900 px-4 md:px-6 py-2.5 flex justify-between items-center z-10 flex-wrap gap-2">
                <div class="flex items-center space-x-2">
                    <button onclick="closeReader()" class="px-3 md:px-4 py-2 rounded-lg bg-zinc-900 hover:bg-zinc-800 text-zinc-300 border border-zinc-800 flex items-center space-x-2 text-sm font-medium transition-all shadow">
                        <i class="fa-solid fa-arrow-left text-amber-500"></i>
                        <span>Shelf</span>
                    </button>

                    <button id="tocToggleBtn" onclick="toggleChapterSidebar()" title="Index" class="hidden px-3 py-2 rounded-lg bg-zinc-900 hover:bg-zinc-800 text-amber-400 border border-zinc-800 items-center justify-center text-sm font-medium transition-all shadow">
                        <i class="fa-solid fa-list-ul"></i>
                    </button>
                </div>

                <div class="text-center px-2 flex-1 min-w-[150px]">
                    <h3 id="readerTitle" class="font-cinzel text-sm md:text-lg font-bold text-zinc-100 tracking-wider truncate">Book Title</h3>
                    <p id="readerAuthor" class="text-[10px] md:text-xs text-amber-500/80 font-sans tracking-wide">Author Name</p>
                </div>

                <div class="flex items-center space-x-2 md:space-x-3">
                    <button id="formatToggleBtn" onclick="toggleFormat()" title="Switch format between PDF and EPUB" class="p-2 px-3 rounded-lg bg-amber-950/80 hover:bg-amber-900 border border-amber-700/60 text-amber-300 text-sm font-medium transition-all flex items-center space-x-1.5 shadow">
                        <i id="formatIcon" class="fa-solid fa-file-pdf"></i>
                        <span id="formatBtnText" class="text-xs font-mono">PDF</span>
                    </button>

                    <button id="viewModeBtn" onclick="toggleViewMode()" title="Toggle Single or Two-Page Spread" class="p-2 px-3 rounded-lg bg-zinc-900 hover:bg-zinc-800 border border-zinc-800 text-amber-400 text-sm font-medium transition-all hidden md:flex items-center space-x-1.5 shadow">
                        <i id="viewModeIcon" class="fa-solid fa-book-open"></i>
                        <span id="viewModeText" class="text-xs">Spread</span>
                    </button>

                    <div id="zoomControls" class="hidden md:flex items-center bg-zinc-900 rounded-lg border border-zinc-800 p-0.5 shadow">
                        <button onclick="zoomOut()" title="Zoom Out" class="p-2 px-2.5 hover:bg-zinc-800 text-amber-400 hover:text-amber-300 rounded-l-md transition-colors">
                            <i class="fa-solid fa-magnifying-glass-minus"></i>
                        </button>
                        <span id="zoomLevelDisplay" class="px-2 text-xs font-mono text-zinc-300">100%</span>
                        <button onclick="zoomIn()" title="Zoom In" class="p-2 px-2.5 hover:bg-zinc-800 text-amber-400 hover:text-amber-300 rounded-r-md transition-colors">
                            <i class="fa-solid fa-magnifying-glass-plus"></i>
                        </button>
                        <button onclick="resetZoom()" title="Reset Zoom" class="p-2 px-2 border-l border-zinc-800 hover:bg-zinc-800 text-zinc-400 hover:text-amber-400 rounded-r-md text-xs font-mono transition-colors">
                            Reset
                        </button>
                    </div>

                    <button onclick="toggleReaderFullScreen()" title="Fullscreen Reader" class="p-2 px-3 rounded-lg bg-zinc-900 hover:bg-zinc-800 border border-zinc-800 text-amber-400 text-sm font-medium transition-all hidden md:flex items-center space-x-1.5 shadow">
                        <i id="readerFsIcon" class="fa-solid fa-expand"></i>
                        <span id="readerFsText" class="text-xs">Fullscreen</span>
                    </button>

                    <div id="pageTracker" class="flex items-center space-x-1 text-xs text-zinc-400 font-mono bg-zinc-900 px-2.5 py-1.5 rounded-md border border-zinc-800">
                        <i class="fa-solid fa-bookmark text-amber-500"></i>
                        <span><span id="currentPageNum" class="text-zinc-100 font-bold">1</span>/<span id="totalPagesNum">50</span></span>
                    </div>
                </div>
            </div>

            <!-- Viewport Container -->
            <div id="readerCanvasContainer" class="flex-1 flex items-center justify-center p-0 m-0 relative overflow-hidden select-none bg-black">
                
                <!-- EPUB Navigation Sidebar -->
                <div id="chapterSidebar" class="absolute left-0 top-0 bottom-0 w-64 md:w-80 bg-zinc-900 border-r border-zinc-800 shadow-2xl z-40 transform -translate-x-full transition-transform duration-300 flex flex-col">
                    <div class="p-4 border-b border-zinc-800 flex justify-between items-center bg-zinc-950">
                        <h4 class="font-cinzel text-amber-400 font-bold text-sm tracking-wider flex items-center space-x-2">
                            <i class="fa-solid fa-list-ul"></i>
                            <span>CONTENTS</span>
                        </h4>
                        <button onclick="toggleChapterSidebar()" class="text-zinc-400 hover:text-white text-sm p-1">
                            <i class="fa-solid fa-xmark"></i>
                        </button>
                    </div>
                    <div id="chapterListContainer" class="flex-1 overflow-y-auto p-2 space-y-1 text-xs font-sans">
                        <div class="text-zinc-500 text-center py-6">Loading contents...</div>
                    </div>
                </div>

                <!-- Spread View Container (PDF Desktop) -->
                <div id="spreadViewContainer" class="w-full h-full flex items-center justify-center bg-black transition-transform duration-200 origin-center">
                    <div id="leftPageWrapper" class="w-1/2 h-full flex items-center justify-end bg-black overflow-hidden pr-0">
                        <canvas id="pdfCanvasLeft" class="max-h-full max-w-full object-contain shadow-2xl"></canvas>
                    </div>
                    <div id="rightPageWrapper" class="w-1/2 h-full flex items-center justify-start bg-black overflow-hidden pl-0">
                        <canvas id="pdfCanvasRight" class="max-h-full max-w-full object-contain shadow-2xl"></canvas>
                    </div>
                </div>

                <!-- Single View Container -->
                <div id="singleViewContainer" class="w-full h-full hidden items-center justify-center bg-black overflow-hidden transition-transform duration-200 origin-center">
                    <canvas id="pdfCanvasSingle" class="max-h-full max-w-full object-contain shadow-2xl"></canvas>
                </div>

                <!-- Vertical Scroll View Container (PDF Mobile) -->
                <div id="verticalScrollViewContainer" class="w-full h-full hidden flex-col items-center overflow-y-auto py-6 px-2 space-y-6 bg-black transition-transform duration-200">
                </div>

                <!-- EPUB View Container -->
                <div id="epubContainer" class="w-full h-full hidden bg-white text-zinc-900 relative flex flex-col items-center justify-start overflow-y-auto overflow-x-hidden transition-colors duration-300">
                    <div id="epubViewerArea" class="w-full h-full max-w-4xl mx-auto p-4 md:p-8 overflow-y-auto overflow-x-hidden"></div>
                </div>

                <!-- Floating Navigation Arrows -->
                <button id="prevArrowBtn" onclick="prevPage()" class="absolute left-4 top-1/2 -translate-y-1/2 w-12 h-12 rounded-full bg-zinc-900/80 hover:bg-amber-600 border border-zinc-700/60 text-amber-400 hover:text-white flex items-center justify-center transition-all shadow-2xl z-20 group">
                    <i class="fa-solid fa-chevron-left text-xl group-hover:-translate-x-0.5 transition-transform"></i>
                </button>

                <button id="nextArrowBtn" onclick="nextPage()" class="absolute right-4 top-1/2 -translate-y-1/2 w-12 h-12 rounded-full bg-zinc-900/80 hover:bg-amber-600 border border-zinc-700/60 text-amber-400 hover:text-white flex items-center justify-center transition-all shadow-2xl z-20 group">
                    <i class="fa-solid fa-chevron-right text-xl group-hover:translate-x-0.5 transition-transform"></i>
                </button>
            </div>

            <!-- E-Reader Bottom Bar Navigation -->
            <div id="readerFooterBar" class="w-full bg-zinc-950/90 backdrop-blur border-t border-zinc-900 px-4 md:px-6 py-2 hidden md:flex flex-row items-center justify-between gap-4 z-10">
                <div class="w-full flex items-center space-x-3">
                    <span class="text-xs text-zinc-500 font-mono">1</span>
                    <input type="range" id="pageSlider" min="1" max="50" value="1" oninput="onSliderChange(this.value)" class="w-full h-1.5 bg-zinc-900 rounded-lg appearance-none cursor-pointer accent-amber-600 focus:outline-none">
                    <span id="sliderMaxLabel" class="text-xs text-zinc-500 font-mono">50</span>
                </div>

                <div class="flex items-center space-x-2 text-xs">
                    <button onclick="goToPage(1)" class="px-3 py-1 rounded bg-zinc-900 hover:bg-zinc-800 border border-zinc-800 text-zinc-300 transition-colors">First</button>
                    <button onclick="goToPage(currentBook ? currentBook.totalPages : 50)" class="px-3 py-1 rounded bg-zinc-900 hover:bg-zinc-800 border border-zinc-800 text-zinc-300 transition-colors">Last</button>
                </div>
            </div>

        </div>

        <footer class="w-full bg-black/80 border-t border-amber-900/30 py-3 px-6 text-center text-xs text-amber-700/60 z-10">
            <p>&copy; 2026 . R.N</p>
        </footer>

    </div>

    <script>
        if (window.pdfjsLib) {
            pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        }

        const booksData = [
            { id: 'book-1', title: 'Book 1', author: 'Author Name', pdfPath: 'book1.pdf', epubPath: 'book1.epub', spineBg: 'bg-gradient-to-r from-zinc-950 via-zinc-900 to-zinc-950', textCol: 'text-amber-400', border: 'border-zinc-700/70', row: 1 },
            { id: 'book-2', title: 'Book 2', author: 'Author Name', pdfPath: 'book2.pdf', epubPath: 'book2.epub', spineBg: 'bg-gradient-to-r from-stone-100 via-stone-200 to-stone-100', textCol: 'text-stone-900', border: 'border-stone-300/80', row: 1 },
            { id: 'book-3', title: 'Book 3', author: 'Author Name', pdfPath: 'book3.pdf', epubPath: 'book3.epub', spineBg: 'bg-gradient-to-r from-stone-100 via-stone-200 to-stone-100', textCol: 'text-stone-900', border: 'border-stone-300/80', row: 1 },
            { id: 'book-4', title: 'Book 4', author: 'Author Name', pdfPath: 'book4.pdf', epubPath: 'book4.epub', spineBg: 'bg-gradient-to-r from-stone-100 via-stone-200 to-stone-100', textCol: 'text-stone-900', border: 'border-stone-300/80', row: 1 },
            { id: 'book-5', title: 'Book 5', author: 'Author Name', pdfPath: 'book5.pdf', epubPath: 'book5.epub', spineBg: 'bg-gradient-to-r from-stone-100 via-stone-200 to-stone-100', textCol: 'text-stone-900', border: 'border-stone-300/80', row: 2 },
            { id: 'book-6', title: 'Book 6', author: 'Author Name', pdfPath: 'book6.pdf', epubPath: 'book6.epub', spineBg: 'bg-gradient-to-r from-stone-100 via-stone-200 to-stone-100', textCol: 'text-stone-900', border: 'border-stone-300/80', row: 2 },
            { id: 'book-7', title: 'Book 7', author: 'Author Name', pdfPath: 'book7.pdf', epubPath: 'book7.epub', spineBg: 'bg-gradient-to-r from-stone-100 via-stone-200 to-stone-100', textCol: 'text-stone-900', border: 'border-stone-300/80', row: 2 },
            { id: 'book-8', title: 'Book 8', author: 'Author Name', pdfPath: 'book8.pdf', epubPath: 'book8.epub', spineBg: 'bg-gradient-to-r from-stone-100 via-stone-200 to-stone-100', textCol: 'text-stone-900', border: 'border-stone-300/80', row: 2 }
        ];

        let currentBook = null;
        let pdfDoc = null;
        let currentPage = 1;
        let isSinglePageView = false;
        let currentFormat = 'pdf'; 
        let epubBookInstance = null;
        let epubRendition = null;

        let currentZoomScale = 1.0;
        const MIN_ZOOM = 0.8;
        const MAX_ZOOM = 2.5;
        const ZOOM_STEP = 0.25;

        const STORAGE_KEY = 'gentlemans_archive_progress_v8';

        function isMobileDevice() {
            return window.innerWidth < 768;
        }

        function loadProgress() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY);
                return saved ? JSON.parse(saved) : {};
            } catch (e) {
                return {};
            }
        }

        function saveProgress(bookId, pageNum) {
            try {
                const progress = loadProgress();
                progress[bookId] = { page: pageNum, updatedAt: new Date().toISOString() };
                localStorage.setItem(STORAGE_KEY, JSON.stringify(progress));
            } catch (e) {
                console.warn('Could not save reading progress:', e);
            }
        }

        function renderBookshelf() {
            const row1 = document.getElementById('shelfRow1');
            const row2 = document.getElementById('shelfRow2');

            if (!row1 || !row2) return;

            row1.innerHTML = '';
            row2.innerHTML = '';

            const progress = loadProgress();

            booksData.forEach(book => {
                const bookProgress = progress[book.id];
                const savedPage = bookProgress ? bookProgress.page : 1;

                const spine = document.createElement('div');
                spine.className = `book-spine w-14 sm:w-16 md:w-20 h-40 sm:h-44 md:h-52 ${book.spineBg} border ${book.border} rounded-sm flex flex-col justify-between py-3 px-1.5 sm:px-2 shadow-2xl flex-shrink-0`;
                
                spine.innerHTML = `
                    <div class="spine-ridge top-4"></div>
                    <div class="spine-ridge top-8"></div>
                    <div class="text-center">
                        <span class="font-cinzel text-[9px] sm:text-[10px] md:text-xs font-black tracking-widest ${book.textCol} drop-shadow">R.N</span>
                    </div>
                    <div class="flex-1 flex items-center justify-center py-2">
                        <span class="spine-text-vertical font-cinzel text-[11px] sm:text-xs md:text-sm font-bold tracking-widest ${book.textCol} truncate max-h-32 sm:max-h-36 drop-shadow">
                            ${book.title}
                        </span>
                    </div>
                    <div class="text-center font-mono text-[9px] ${book.textCol} opacity-80">
                        ${savedPage > 1 ? `<span class="text-emerald-500 font-bold">P.${savedPage}</span>` : ''}
                    </div>
                    <div class="spine-ridge bottom-8"></div>
                    <div class="spine-ridge bottom-4"></div>
                `;

                spine.onclick = () => openBook(book.id);

                if (book.row === 1) {
                    row1.appendChild(spine);
                } else {
                    row2.appendChild(spine);
                }
            });
        }

        async function openBook(bookId) {
            currentBook = booksData.find(b => b.id === bookId);
            if (!currentBook) return;

            resetZoom();
            currentFormat = 'pdf';

            const progress = loadProgress();
            currentPage = (progress[bookId] && progress[bookId].page) ? progress[bookId].page : 1;

            if (!isMobileDevice() && !isSinglePageView && currentPage % 2 === 0) {
                currentPage -= 1;
            }
            if (currentPage < 1) currentPage = 1;

            document.getElementById('readerTitle').innerText = currentBook.title;
            document.getElementById('readerAuthor').innerText = currentBook.author;

            const readerView = document.getElementById('readerView');
            readerView.classList.remove('hidden');
            readerView.classList.add('flex');

            currentBook.totalPages = 50;

            try {
                if (window.pdfjsLib && currentBook.pdfPath) {
                    const loadingTask = pdfjsLib.getDocument(currentBook.pdfPath);
                    pdfDoc = await loadingTask.promise;
                    currentBook.totalPages = pdfDoc.numPages;
                }
            } catch (e) {
                console.warn('PDF load fallback enabled:', e);
                pdfDoc = null;
            }

            document.getElementById('totalPagesNum').innerText = currentBook.totalPages;
            const slider = document.getElementById('pageSlider');
            slider.max = currentBook.totalPages;
            document.getElementById('sliderMaxLabel').innerText = currentBook.totalPages;

            if (currentPage > currentBook.totalPages) currentPage = 1;

            await updatePageSpread();
            updateFormatUI();
        }

        function toggleChapterSidebar() {
            const sidebar = document.getElementById('chapterSidebar');
            if (sidebar.classList.contains('-translate-x-full')) {
                sidebar.classList.remove('-translate-x-full');
            } else {
                sidebar.classList.add('-translate-x-full');
            }
        }

        async function toggleFormat() {
            resetZoom();
            currentFormat = currentFormat === 'pdf' ? 'epub' : 'pdf';
            updateFormatUI();

            if (currentFormat === 'epub') {
                await openEpubFormat();
            } else {
                await openPdfFormat();
            }
        }

        function updateFormatUI() {
            const btnText = document.getElementById('formatBtnText');
            const btnIcon = document.getElementById('formatIcon');
            const zoomControls = document.getElementById('zoomControls');
            const viewModeBtn = document.getElementById('viewModeBtn');
            const footerBar = document.getElementById('readerFooterBar');
            const tocBtn = document.getElementById('tocToggleBtn');
            const prevArrow = document.getElementById('prevArrowBtn');
            const nextArrow = document.getElementById('nextArrowBtn');

            if (currentFormat === 'epub') {
                btnText.innerText = "EPUB";
                btnIcon.className = "fa-solid fa-book-bookmark text-amber-400";
                
                if (zoomControls) zoomControls.classList.add('hidden'), zoomControls.classList.remove('md:flex');
                if (viewModeBtn) viewModeBtn.classList.add('hidden'), viewModeBtn.classList.remove('md:flex');
                if (footerBar) footerBar.classList.add('hidden'), footerBar.classList.remove('md:flex');
                if (tocBtn) tocBtn.classList.remove('hidden'), tocBtn.classList.add('flex');
                
                if (prevArrow && nextArrow) {
                    prevArrow.classList.add('hidden');
                    nextArrow.classList.add('hidden');
                }
            } else {
                btnText.innerText = "PDF";
                btnIcon.className = "fa-solid fa-file-pdf text-amber-400";
                
                if (zoomControls && !isMobileDevice()) zoomControls.classList.remove('hidden'), zoomControls.classList.add('md:flex');
                if (viewModeBtn && !isMobileDevice()) viewModeBtn.classList.remove('hidden'), viewModeBtn.classList.add('md:flex');
                if (footerBar && !isMobileDevice()) footerBar.classList.remove('hidden'), footerBar.classList.add('md:flex');
                if (tocBtn) tocBtn.classList.add('hidden'), tocBtn.classList.remove('flex');
                if (prevArrow && !isMobileDevice()) prevArrow.classList.remove('hidden');
                if (nextArrow && !isMobileDevice()) nextArrow.classList.remove('hidden');
                
                document.getElementById('chapterSidebar').classList.add('-translate-x-full');
            }
        }

        async function openEpubFormat() {
            document.getElementById('spreadViewContainer').classList.add('hidden');
            document.getElementById('singleViewContainer').classList.add('hidden');
            document.getElementById('verticalScrollViewContainer').classList.add('hidden');

            const epubContainer = document.getElementById('epubContainer');
            const epubViewerArea = document.getElementById('epubViewerArea');
            epubContainer.classList.remove('hidden');
            epubViewerArea.innerHTML = '';

            if (!currentBook || !currentBook.epubPath) {
                epubViewerArea.innerHTML = '<div class="text-amber-900 text-center py-20 font-cinzel">No EPUB file mapped for this book.</div>';
                return;
            }

            try {
                if (typeof ePub === 'undefined') {
                    throw new Error('ePub library not loaded');
                }

                epubBookInstance = ePub(currentBook.epubPath);
                
                // Use scrolled flow to sequence cover page through all chapters in a single scrollable stream
                epubRendition = epubBookInstance.renderTo("epubViewerArea", {
                    width: "100%",
                    height: "100%",
                    flow: "scrolled",
                    allowScriptedContent: true
                });

                epubRendition.themes.default({
                    'body': {
                        'background': '#ffffff !important',
                        'color': '#18181b !important',
                        'font-family': 'Inter, sans-serif !important',
                        'line-height': '1.6 !important',
                        'padding': isMobileDevice() ? '10px !important' : '20px !important',
                        'overflow-x': 'hidden !important',
                        'max-width': '100% !important'
                    },
                    'html': {
                        'overflow-x': 'hidden !important',
                        'max-width': '100% !important'
                    },
                    'img': {
                        'max-width': '100% !important',
                        'height': 'auto !important'
                    }
                });

                await epubBookInstance.ready;

                const targetPercentage = (currentPage - 1) / (currentBook.totalPages || 1);
                
                epubBookInstance.locations.generate(1000).then(() => {
                    const cfi = epubBookInstance.locations.cfiFromPercentage(targetPercentage);
                    if (cfi) {
                        epubRendition.display(cfi);
                    } else {
                        epubRendition.display();
                    }
                }).catch(() => {
                    epubRendition.display();
                });

                epubRendition.on('relocated', (location) => {
                    if (location && location.start && epubBookInstance.locations) {
                        const percent = epubBookInstance.locations.percentageFromCfi(location.start.cfi);
                        if (percent !== undefined && currentBook.totalPages) {
                            const calculatedPage = Math.max(1, Math.min(Math.round(percent * currentBook.totalPages) + 1, currentBook.totalPages));
                            currentPage = calculatedPage;
                            saveProgress(currentBook.id, currentPage);
                            document.getElementById('currentPageNum').innerText = currentPage;
                        }
                    }
                });

                epubRendition.hooks.content.register(function(contents) {
                    const doc = contents.document;
                    if (doc) {
                        const style = doc.createElement('style');
                        style.innerHTML = `
                            body, html {
                                overflow-x: hidden !important;
                                max-width: 100% !important;
                                box-sizing: border-box !important;
                                scrollbar-width: none !important;
                                -ms-overflow-style: none !important;
                            }
                            body::-webkit-scrollbar, html::-webkit-scrollbar {
                                display: none !important;
                                width: 0px !important;
                                height: 0px !important;
                            }
                        `;
                        doc.head.appendChild(style);
                    }
                });

                const tocContainer = document.getElementById('chapterListContainer');
                tocContainer.innerHTML = '';

                epubBookInstance.loaded.navigation.then(function(nav) {
                    const tocItems = nav.toc || [];

                    // Context Button
                    const contextBtn = document.createElement('button');
                    contextBtn.className = "w-full text-left px-3 py-2.5 rounded bg-amber-950/40 hover:bg-amber-900 text-amber-300 font-semibold transition-colors flex items-center space-x-2 border-b border-zinc-800 text-xs";
                    contextBtn.innerHTML = '<i class="fa-solid fa-file-lines text-amber-500"></i><span>Context</span>';
                    contextBtn.onclick = () => {
                        if (epubBookInstance.spine && epubBookInstance.spine.get(0)) {
                            epubRendition.display(epubBookInstance.spine.get(0).href);
                        } else {
                            epubRendition.display(0);
                        }
                        toggleChapterSidebar();
                    };
                    tocContainer.appendChild(contextBtn);

                    const chHeader = document.createElement('div');
                    chHeader.className = "px-3 py-1 font-cinzel text-zinc-400 font-bold text-[10px] tracking-widest uppercase mt-2 mb-1";
                    chHeader.innerText = "Chapters";
                    tocContainer.appendChild(chHeader);

                    if (tocItems.length > 0) {
                        tocItems.forEach(function(chapter) {
                            const btn = document.createElement('button');
                            btn.className = "w-full text-left px-3 py-2 rounded hover:bg-zinc-800 text-zinc-300 hover:text-amber-400 transition-colors truncate border-b border-zinc-800/50";
                            btn.innerText = chapter.label.trim() || 'Untitled Chapter';
                            btn.onclick = () => {
                                epubRendition.display(chapter.href);
                                toggleChapterSidebar();
                            };
                            tocContainer.appendChild(btn);
                        });
                    } else {
                        const emptyDiv = document.createElement('div');
                        emptyDiv.className = "text-zinc-500 text-center py-4";
                        emptyDiv.innerText = "No chapters listed in EPUB.";
                        tocContainer.appendChild(emptyDiv);
                    }
                });

                document.getElementById('currentPageNum').innerText = currentPage;
                document.getElementById('totalPagesNum').innerText = currentBook.totalPages || "EPUB";

            } catch (e) {
                console.error("EPUB render failed:", e);
                epubViewerArea.innerHTML = `<div class="text-amber-800 text-center py-20 font-mono text-sm">Failed to load EPUB file (${currentBook.epubPath}).<br><span class="text-zinc-500 text-xs mt-2 block">Ensure file exists on web server or GitHub Pages repository.</span></div>`;
            }
        }

        async function openPdfFormat() {
            const epubContainer = document.getElementById('epubContainer');
            epubContainer.classList.add('hidden');

            if (epubRendition) {
                try { epubRendition.destroy(); } catch(e){}
                epubRendition = null;
            }

            await updatePageSpread();
        }

        async function updatePageSpread() {
            if (!currentBook || currentFormat === 'epub') return;

            saveProgress(currentBook.id, currentPage);

            const container = document.getElementById('readerCanvasContainer');
            const fullW = container.clientWidth;
            const fullH = container.clientHeight;

            document.getElementById('currentPageNum').innerText = currentPage;
            document.getElementById('pageSlider').value = currentPage;

            const spreadContainer = document.getElementById('spreadViewContainer');
            const singleContainer = document.getElementById('singleViewContainer');
            const verticalContainer = document.getElementById('verticalScrollViewContainer');
            const prevArrow = document.getElementById('prevArrowBtn');
            const nextArrow = document.getElementById('nextArrowBtn');

            if (isMobileDevice()) {
                spreadContainer.classList.add('hidden');
                singleContainer.classList.add('hidden');
                verticalContainer.classList.remove('hidden');
                verticalContainer.classList.add('flex');
                
                prevArrow.classList.add('hidden');
                nextArrow.classList.add('hidden');

                if (verticalContainer.children.length === 0 && pdfDoc) {
                    verticalContainer.innerHTML = '';
                    for (let i = 1; i <= pdfDoc.numPages; i++) {
                        const wrapper = document.createElement('div');
                        wrapper.className = 'w-full flex justify-center mb-4';
                        const canvas = document.createElement('canvas');
                        canvas.id = `verticalCanvas-${i}`;
                        canvas.className = 'max-w-full shadow-2xl rounded';
                        wrapper.appendChild(canvas);
                        verticalContainer.appendChild(wrapper);

                        const page = await pdfDoc.getPage(i);
                        const viewportUnscaled = page.getViewport({ scale: 1 });
                        const scale = (fullW / viewportUnscaled.width) * 2.0;
                        const viewport = page.getViewport({ scale: scale });
                        canvas.width = viewport.width;
                        canvas.height = viewport.height;
                        await page.render({ canvasContext: canvas.getContext('2d'), viewport: viewport }).promise;
                    }
                }
            } else {
                prevArrow.classList.remove('hidden');
                nextArrow.classList.remove('hidden');
                verticalContainer.classList.add('hidden');

                if (isSinglePageView) {
                    spreadContainer.classList.add('hidden');
                    singleContainer.classList.remove('hidden');
                    singleContainer.classList.add('flex');
                    await renderCanvasPage(currentPage, 'pdfCanvasSingle', fullW, fullH);
                } else {
                    singleContainer.classList.add('hidden');
                    spreadContainer.classList.remove('hidden');
                    spreadContainer.classList.add('flex');
                    const halfW = Math.floor(fullW / 2);
                    await renderCanvasPage(currentPage, 'pdfCanvasLeft', halfW, fullH);
                    await renderCanvasPage(currentPage + 1, 'pdfCanvasRight', halfW, fullH);
                }
            }
        }

        async function renderCanvasPage(pageNum, canvasId, containerWidth, containerHeight) {
            const canvas = document.getElementById(canvasId);
            if (!canvas) return;

            const ctx = canvas.getContext('2d');

            if (!pdfDoc || pageNum > pdfDoc.numPages || pageNum < 1) {
                canvas.width = containerWidth || 800;
                canvas.height = containerHeight || 1100;
                ctx.fillStyle = '#000000';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                return;
            }

            try {
                const page = await pdfDoc.getPage(pageNum);
                const viewportUnscaled = page.getViewport({ scale: 1 });
                const scaleX = containerWidth / viewportUnscaled.width;
                const scaleY = containerHeight / viewportUnscaled.height;
                const scale = Math.min(scaleX, scaleY) * 2.5;

                const viewport = page.getViewport({ scale: scale });
                canvas.width = viewport.width;
                canvas.height = viewport.height;

                await page.render({ canvasContext: ctx, viewport: viewport }).promise;
            } catch (e) {
                console.error('Error rendering canvas page:', e);
            }
        }

        function zoomIn() {
            if (currentFormat === 'epub') return;
            if (currentZoomScale < MAX_ZOOM) {
                currentZoomScale = Math.min(MAX_ZOOM, currentZoomScale + ZOOM_STEP);
                applyZoom();
            }
        }

        function zoomOut() {
            if (currentFormat === 'epub') return;
            if (currentZoomScale > MIN_ZOOM) {
                currentZoomScale = Math.max(MIN_ZOOM, currentZoomScale - ZOOM_STEP);
                applyZoom();
            }
        }

        function resetZoom() {
            currentZoomScale = 1.0;
            applyZoom();
        }

        function applyZoom() {
            const spreadContainer = document.getElementById('spreadViewContainer');
            const singleContainer = document.getElementById('singleViewContainer');
            const display = document.getElementById('zoomLevelDisplay');

            if (display) display.innerText = `${Math.round(currentZoomScale * 100)}%`;
            const transformValue = `scale(${currentZoomScale})`;
            
            [spreadContainer, singleContainer].forEach(el => {
                if (el) el.style.transform = transformValue;
            });
        }

        function toggleViewMode() {
            if (isMobileDevice() || currentFormat === 'epub') return;
            isSinglePageView = !isSinglePageView;
            const icon = document.getElementById('viewModeIcon');
            const text = document.getElementById('viewModeText');

            if (isSinglePageView) {
                icon.className = "fa-solid fa-file";
                text.innerText = "Single";
            } else {
                icon.className = "fa-solid fa-book-open";
                text.innerText = "Spread";
                if (currentPage % 2 === 0) currentPage -= 1;
            }
            updatePageSpread();
        }

        function closeReader() {
            const readerView = document.getElementById('readerView');
            readerView.classList.add('hidden');
            readerView.classList.remove('flex');

            const verticalContainer = document.getElementById('verticalScrollViewContainer');
            if (verticalContainer) verticalContainer.innerHTML = '';

            if (epubRendition) {
                try { epubRendition.destroy(); } catch(e){}
                epubRendition = null;
            }

            if (document.fullscreenElement) {
                document.exitFullscreen().catch(() => {});
            }

            renderBookshelf();
        }

        async function nextPage() {
            if (currentFormat === 'epub') return;
            if (!currentBook) return;
            const step = (isMobileDevice() || isSinglePageView) ? 1 : 2;
            if (currentPage + step <= currentBook.totalPages) {
                currentPage += step;
                await updatePageSpread();
            }
        }

        async function prevPage() {
            if (currentFormat === 'epub') return;
            if (!currentBook) return;
            const step = (isMobileDevice() || isSinglePageView) ? 1 : 2;
            if (currentPage - step >= 1) {
                currentPage -= step;
                await updatePageSpread();
            }
        }

        async function goToPage(page) {
            if (!currentBook || currentFormat === 'epub') return;
            let target = parseInt(page);
            if (isNaN(target)) return;

            if (!isMobileDevice() && !isSinglePageView && target % 2 === 0) {
                target -= 1;
            }

            if (target < 1) target = 1;
            if (target > currentBook.totalPages) target = currentBook.totalPages;

            currentPage = target;
            await updatePageSpread();
        }

        async function onSliderChange(val) {
            await goToPage(parseInt(val));
        }

        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.error("Fullscreen error:", err);
                });
                document.getElementById('fullscreenIcon').className = "fa-solid fa-compress text-amber-400";
                document.getElementById('fullscreenText').innerText = "Exit Fullscreen";
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
                document.getElementById('fullscreenIcon').className = "fa-solid fa-expand text-amber-400";
                document.getElementById('fullscreenText').innerText = "Fullscreen";
            }
        }

        function toggleReaderFullScreen() {
            const readerView = document.getElementById('readerView');
            if (!document.fullscreenElement) {
                readerView.requestFullscreen().catch(err => {
                    console.error("Reader fullscreen error:", err);
                });
                document.getElementById('readerFsIcon').className = "fa-solid fa-compress";
                document.getElementById('readerFsText').innerText = "Exit FS";
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
                document.getElementById('readerFsIcon').className = "fa-solid fa-expand";
                document.getElementById('readerFsText').innerText = "Fullscreen";
            }
        }

        document.addEventListener('keydown', (e) => {
            const readerView = document.getElementById('readerView');
            if (readerView && readerView.classList.contains('flex')) {
                if (e.key === 'ArrowRight' || e.key === 'PageDown') {
                    if (currentFormat !== 'epub') nextPage();
                } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
                    if (currentFormat !== 'epub') prevPage();
                } else if (e.key === '+' || e.key === '=') {
                    zoomIn();
                } else if (e.key === '-') {
                    zoomOut();
                } else if (e.key === '0') {
                    resetZoom();
                } else if (e.key === 'Escape') {
                    closeReader();
                }
            }
        });

        window.addEventListener('resize', () => {
            const readerView = document.getElementById('readerView');
            if (readerView && readerView.classList.contains('flex')) {
                const verticalContainer = document.getElementById('verticalScrollViewContainer');
                if (verticalContainer && isMobileDevice()) {
                    verticalContainer.innerHTML = '';
                }
                updatePageSpread();
            }
        });

        window.addEventListener('DOMContentLoaded', () => {
            renderBookshelf();
        });
    </script>
</body>
</html>
