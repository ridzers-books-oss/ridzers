<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>R.N</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Inter:wght@400;500&family=Pixelify+Sans:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/epubjs@0.3.93/dist/epub.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
body{min-height:100vh;display:flex;flex-direction:column;font-family:Inter,sans-serif;color:#f0dcb4;background:radial-gradient(ellipse at 50% 15%,#3b2212,#0c0603 75%);overflow-x:hidden}
button{font:inherit;cursor:pointer;color:#f0d9a8;background:#2a1708;border:1px solid #6b4220;border-radius:8px;padding:8px 12px}
button:hover{background:#4a2a10}
.top{display:flex;justify-content:space-between;align-items:center;padding:12px 20px;background:#0a0503e6;border-bottom:1px solid #4a2a10;position:sticky;top:0;z-index:20}
.top h1{font:800 22px Cinzel,serif;letter-spacing:.12em;color:#e9c987}
h2{font:800 34px Cinzel,serif;text-align:center;margin:30px 0 22px;color:#f6e3b4;text-shadow:0 2px 8px #000}
/* bookcase */
.case{width:min(980px,96vw);margin:0 auto 40px;padding:24px 28px 0;border-radius:8px 8px 2px 2px;background:repeating-linear-gradient(90deg,#4b2710 0 7px,#3e1f0b 7px 13px,#52290f 13px 17px);box-shadow:0 30px 60px #000c,inset 0 0 0 2px #1d0d04,inset 0 4px 0 #8a5528}
.row{position:relative;display:flex;align-items:flex-end;justify-content:center;gap:2px;padding:0 18px;min-height:290px;background:repeating-linear-gradient(90deg,#150a04 0 9px,#1b0e06 9px 18px);box-shadow:inset 0 18px 28px #000d,inset 18px 0 24px #0009,inset -18px 0 24px #0009}
.plank{height:24px;margin:0 -10px 22px;border-radius:2px;background:linear-gradient(#a06632,#6a3715 35%,#3a1a08);box-shadow:0 12px 20px #000c,inset 0 2px 0 #d49a5e,inset 0 -3px 0 #1b0b03}
.spine{--k:1;position:relative;flex:none;width:calc(var(--w)*var(--k));height:calc(var(--h)*var(--k));color:var(--t);font-family:Cinzel,serif;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:14px 0 12px;cursor:pointer;border-radius:3px 2px 2px 3px;transition:transform .25s;background:linear-gradient(90deg,#0007,#fff2 14%,#0000 38%,#0003 85%,#0008),var(--c);box-shadow:inset 0 3px 3px #fff3,inset 0 -5px 5px #0006,4px 0 8px #0008}
.spine:hover{transform:translateY(-9px)}
.spine.lean{transform:rotate(-5deg);transform-origin:bottom left;margin-left:12px;margin-right:14px}
.spine.lean:hover{transform:rotate(-5deg) translateY(-9px)}
.spine .bd{position:absolute;left:0;right:0;height:5px;background:var(--t);opacity:.7;box-shadow:0 6px 0 -2px var(--t)}
.spine i{font:800 10px Cinzel,serif;font-style:normal;letter-spacing:.1em;z-index:1}
.spine .mid{display:flex;gap:7px;flex:1;align-items:center;justify-content:center;z-index:1;overflow:hidden;padding:6px 0}
.spine b{writing-mode:vertical-rl;font-size:calc(14px*var(--k));letter-spacing:.14em;text-shadow:0 1px 1px #0008;white-space:nowrap}
.spine u{writing-mode:vertical-rl;text-decoration:none;font-size:calc(8px*var(--k));letter-spacing:.2em;opacity:.8;white-space:nowrap}
.spine em{font:700 9px Inter,sans-serif;font-style:normal;color:#7fe0a8;min-height:11px;z-index:1}
.ghost{position:fixed;margin:0!important;z-index:70;pointer-events:none;transform-origin:center;box-shadow:0 30px 50px #000c}
@media(max-width:700px){.spine{--k:.78}.row{min-height:240px;padding:0 6px}.case{padding:14px 12px 0}h2{font-size:26px}}
/* reader */
#reader{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;background:radial-gradient(ellipse at 50% 40%,#2a1709,#050302 80%);opacity:0;transition:opacity .4s}
#reader.on{opacity:1}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:8px 14px;background:#0a0604f0;border-bottom:1px solid #2e1a0a;z-index:5}
.bar .g{display:flex;align-items:center;gap:8px}
.bar h3{font:800 15px Cinzel,serif;text-align:center}
.bar small{display:block;text-align:center;font-size:11px;color:#c9954f}
.pill{display:flex;align-items:center;gap:6px;font:12px ui-monospace,monospace;background:#1b0f07;border:1px solid #3b2210;border-radius:8px;padding:6px 10px}
.pill button{padding:3px 8px;border:0;background:none}
.wrap{position:relative;flex:1;min-height:0}
#stage{position:absolute;inset:0;overflow:auto;display:flex;padding:20px;scrollbar-width:thin}
#stage.pan{cursor:grab}
.spread{position:relative;margin:auto;flex:none;width:calc(var(--W)*2);height:var(--H);perspective:2600px}
.book{position:absolute;left:var(--W);top:0;width:var(--W);height:var(--H);transform-style:preserve-3d;transform-origin:center;transition:transform .9s cubic-bezier(.4,0,.2,1)}
.book::before{content:"";position:absolute;inset:8px -6px -10px -2px;background:#000;filter:blur(20px);opacity:.75;transform:translateZ(-40px)}
.stack{position:absolute;top:3px;bottom:3px;right:-7px;width:8px;transform:translateZ(-2px);background:repeating-linear-gradient(90deg,#fff,#c9c0a8 1px,#ece6d4 2px);border-radius:0 2px 2px 0}
.leaf{position:absolute;inset:0;transform-origin:left center;transform-style:preserve-3d;transition:transform .85s cubic-bezier(.45,0,.25,1)}
.leaf.f{transform:rotateY(-180deg)}
.nt,.nt .leaf{transition:none!important}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:#f6f1e4;overflow:hidden}
.face.b{transform:rotateY(180deg)}
.face canvas{display:block;width:100%;height:100%}
.face::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,#0000004d,#0000 10%)}
.face.b::after{background:linear-gradient(270deg,#0000004d,#0000 10%)}
.leaf.cover .fr{border-radius:0 5px 5px 0;box-shadow:inset 0 0 0 3px #0003,inset 6px 0 0 #0002}
#scroll{position:absolute;inset:0;overflow-y:auto;display:flex;flex-direction:column;align-items:center;gap:16px;padding:16px 8px}
#scroll canvas{background:#f6f1e4;box-shadow:0 10px 30px #000;border-radius:3px;max-width:100%}
#epub{position:absolute;inset:0;background:#fff;color:#18181b}
#epubArea{position:absolute;inset:0;max-width:900px;margin:0 auto;overflow:hidden}
#side{position:absolute;left:0;top:0;bottom:0;width:min(320px,80vw);z-index:6;background:#18110b;border-right:1px solid #3b2210;transform:translateX(-100%);transition:transform .3s;display:flex;flex-direction:column;color:#e8d3a8}
#side.open{transform:none}
#side header{display:flex;justify-content:space-between;padding:12px;border-bottom:1px solid #3b2210;font:700 13px Cinzel,serif}
#toc{overflow:auto;padding:6px}
#toc button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid #2a1c10;border-radius:0;background:none;font-size:13px}
.arrow{position:absolute;top:50%;translate:0 -50%;width:48px;height:48px;border-radius:50%;z-index:4;font-size:18px}
#prev{left:14px}#next{right:14px}
.foot{display:flex;align-items:center;gap:12px;padding:8px 18px;background:#0a0604f0;border-top:1px solid #2e1a0a}
.foot input{flex:1;accent-color:#c9833a}
footer{padding:12px;text-align:center;font-size:12px;color:#8a6a40;background:#0a0503cc}

/* ---------- Minecraft theme ---------- */
body.mc{font-family:'Pixelify Sans',monospace;color:#fff;background:#1b130b conic-gradient(#21170d 25%,#190f07 0 50%,#21170d 0 75%,#190f07 0) 0 0/32px 32px}
.mc h1,.mc h2,.mc .bar h3{font-family:'Pixelify Sans',monospace;font-weight:700;letter-spacing:.04em}
.mc h2{color:#fff;text-shadow:3px 3px 0 #3f3f3f;font-size:40px}
.mc h1{color:#fff;text-shadow:2px 2px 0 #3f3f3f}
.mc button{font-family:inherit;background:#7b7b7b;color:#fff;text-shadow:2px 2px 0 #3a3a3a;border:3px solid;border-color:#d8d8d8 #373737 #373737 #d8d8d8;border-radius:0;outline:2px solid #000}
.mc button:hover{background:#7a86b8}
.mc .top{background:#6b4a24;border-bottom:4px solid #2e1c0a}
.mc .case{border-radius:0;border:6px solid #4a2f14;background:#a47b45 conic-gradient(#b48a52 25%,#9a7240 0 50%,#b48a52 0 75%,#9a7240 0) 0 0/32px 32px;box-shadow:0 20px 0 #0006,inset 0 0 0 4px #c9a066}
.mc .row{background:#2a1c0f conic-gradient(#2f2012 25%,#23160a 0 50%,#2f2012 0 75%,#23160a 0) 0 0/16px 16px;box-shadow:inset 0 12px 0 #0007,inset 8px 0 0 #0005,inset -8px 0 0 #0005}
.mc .plank{border-radius:0;height:26px;background:#b8925a conic-gradient(#c29c62 25%,#ab8650 0 50%,#c29c62 0 75%,#ab8650 0) 0 0/16px 16px;border:4px solid #6b4a24;box-shadow:0 8px 0 #0007}
.mc .spine{border-radius:0;font-family:'Pixelify Sans',monospace;background:var(--c);box-shadow:inset 5px 0 0 #fff3,inset -5px 0 0 #0004,inset 0 5px 0 #fff3,inset 0 -5px 0 #0005,0 0 0 3px #120a04}
.mc .spine:hover{transform:translateY(-8px)}
.mc .spine.lean,.mc .spine.lean:hover{transform:none;margin:0}
.mc .spine .bd{height:6px;opacity:.45;box-shadow:none}
.mc .spine i{font-family:inherit;font-size:12px;font-weight:700}
.mc .spine b{font-size:calc(17px*var(--k));font-weight:700;letter-spacing:.08em;text-shadow:none}
.mc .spine u{font-size:calc(10px*var(--k));font-weight:500;opacity:1;letter-spacing:.12em}
.mc .spine em{font-family:inherit;font-size:11px;color:#3fe07a;text-shadow:1px 1px 0 #000}
.mc #reader{background:#1b130b conic-gradient(#21170d 25%,#190f07 0 50%,#21170d 0 75%,#190f07 0) 0 0/32px 32px}
.mc .bar,.mc .foot{background:#6b4a24;border-color:#2e1c0a;border-width:4px}
.mc .bar small{color:#f3d9a0;font-size:13px}
.mc .pill{font-family:inherit;font-size:14px;border-radius:0;background:#2a1c0f;border:3px solid #120a04;color:#fff}
.mc .pill button{outline:0;border:0;background:none}
.mc .leaf.cover .fr{border-radius:0;box-shadow:inset 0 0 0 4px #0005,0 0 0 3px #120a04}
.mc .arrow{border-radius:0}
.mc #side{background:#2a1c0f;border-right:4px solid #6b4a24}
.mc #toc button{outline:0;border:0;border-bottom:2px solid #4a2f14;background:none;text-shadow:none}
.mc footer{background:#4a2f14;color:#f3d9a0}
</style>
</head>
<body>
<div class="top">
  <h1>THE ARCHIVE</h1>
  <div style="display:flex;gap:8px">
    <button onclick="toggleTheme()" title="Switch theme"><i class="fa-solid fa-cube"></i> <span class="thTxt">Minecraft</span></button>
    <button onclick="toggleFS(document.documentElement)"><i class="fa-solid fa-expand"></i> Fullscreen</button>
  </div>
</div>

<main style="flex:1">
  <h2>Books</h2>
  <div class="case">
    <div class="row" id="row1"></div><div class="plank"></div>
    <div class="row" id="row2"></div><div class="plank"></div>
  </div>
</main>
<footer>&copy; 2026 . R.N</footer>

<div id="reader" hidden>
  <div class="bar">
    <div class="g">
      <button onclick="closeReader()"><i class="fa-solid fa-arrow-left"></i> Shelf</button>
      <button id="tocBtn" hidden onclick="$('side').classList.toggle('open')" title="Contents"><i class="fa-solid fa-list-ul"></i></button>
    </div>
    <div style="flex:1;min-width:130px"><h3 id="rTitle"></h3><small id="rAuthor"></small></div>
    <div class="g">
      <button id="fmtBtn" onclick="setFormat(fmt=='pdf'?'epub':'pdf')" title="Switch between PDF and EPUB"><i id="fmtIc" class="fa-solid fa-file-pdf"></i> <span id="fmtTxt">PDF</span></button>
      <div class="pill" id="zoomBox">
        <button onclick="setZoom(zoom-.25)" title="Zoom out"><i class="fa-solid fa-magnifying-glass-minus"></i></button>
        <span id="zl">100%</span>
        <button onclick="setZoom(zoom+.25)" title="Zoom in"><i class="fa-solid fa-magnifying-glass-plus"></i></button>
        <button onclick="setZoom(1)">Reset</button>
      </div>
      <button onclick="toggleTheme()" title="Switch theme"><i class="fa-solid fa-cube"></i></button>
      <button onclick="toggleFS($('reader'))" title="Fullscreen"><i class="fa-solid fa-expand"></i></button>
      <div class="pill"><i class="fa-solid fa-bookmark" style="color:#d9a24a"></i><span id="cur">1</span>/<span id="tot">1</span></div>
    </div>
  </div>

  <div class="wrap">
    <div id="stage" hidden>
      <div class="spread" id="spread"><div class="book" id="book"></div></div>
    </div>
    <div id="scroll" hidden></div>
    <div id="epub" hidden>
      <div id="epubArea"></div>
      <div id="side"><header><span>CONTENTS</span><span style="cursor:pointer" onclick="$('side').classList.remove('open')"><i class="fa-solid fa-xmark"></i></span></header><div id="toc"></div></div>
    </div>
    <button class="arrow" id="prev" hidden onclick="go(c-1)"><i class="fa-solid fa-chevron-left"></i></button>
    <button class="arrow" id="next" hidden onclick="go(c+1)"><i class="fa-solid fa-chevron-right"></i></button>
  </div>

  <div class="foot" id="foot" hidden>
    <button onclick="go(0)">Cover</button>
    <input type="range" id="sl" min="0" max="1" value="0" oninput="go(+this.value)">
    <button onclick="go(L)">End</button>
  </div>
</div>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const $=id=>document.getElementById(id);
const AUTHOR='Liam L. Larmark';
// [title, cover/spine color, text color, height, width, shelf row]
const SPECS=[
 ['Book 1','#0f0f10','#e8c777',250,64,1],['Book 2','#2d2d30','#e8c777',226,56,1],
 ['Book 3','#4a4a4e','#f3e3b5',240,70,1],['Book 4','#6a6a6e','#ffffff',212,52,1],
 ['Book 5','#8c8c90','#111111',244,62,2],['Book 6','#b0b0b3','#111111',222,58,2],
 ['Book 7','#d4d4d6','#111111',236,66,2],['Book 8','#f6f6f4','#111111',216,54,2]];
const BOOKS=SPECS.map((s,i)=>({id:'book-'+(i+1),title:s[0],author:AUTHOR,pdf:`book${i+1}.pdf`,epub:`book${i+1}.epub`,c:s[1],t:s[2],h:s[3],w:s[4],row:s[5],lean:i==3}));
const KEY='gentlemans_archive_progress_v8';
let bk,pdf,N=50,L=1,c=0,ratio=.7,W=0,H=0,BW=0,zoom=1,fmt='pdf',view='',tok=0,leaves=[],eb=null,rend=null;
const isMobile=()=>innerWidth<768;
const load=()=>{try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return{}}};
const save=(id,p)=>{try{const d=load();d[id]={page:p,updatedAt:new Date().toISOString()};localStorage.setItem(KEY,JSON.stringify(d))}catch(e){}};

function renderShelf(){
  const p=load();
  ['row1','row2'].forEach(r=>$(r).innerHTML='');
  BOOKS.forEach(b=>{
    const pg=(p[b.id]||{}).page||1,s=document.createElement('div');
    s.className='spine'+(b.lean?' lean':'');
    s.style.cssText=`--c:${b.c};--t:${b.t};--h:${b.h}px;--w:${b.w}px`;
    s.innerHTML=`<span class="bd" style="top:14px"></span><span class="bd" style="top:26px"></span><span class="bd" style="bottom:14px"></span><span class="bd" style="bottom:26px"></span>
    <i>R.N</i><div class="mid"><b>${b.title}</b><u>${b.author.toUpperCase()}</u></div><em>${pg>1?'P.'+pg:''}</em>`;
    s.onclick=()=>openBook(b,s);
    $('row'+b.row).appendChild(s);
  });
}

/* ---------- view switching: only one view is ever visible ---------- */
function showView(v){
  view=v;
  $('stage').hidden=v!='book';$('scroll').hidden=v!='scroll';$('epub').hidden=v!='epub';
  ['zoomBox','foot','prev','next'].forEach(i=>$(i).hidden=v!='book');
  $('tocBtn').hidden=v!='epub';
  $('fmtTxt').textContent=fmt.toUpperCase();
  $('fmtIc').className=fmt=='pdf'?'fa-solid fa-file-pdf':'fa-solid fa-book-bookmark';
  $('side').classList.remove('open');
  if(v!='epub')destroyEpub();
}
function destroyEpub(){
  try{rend&&rend.destroy()}catch(e){}
  try{eb&&eb.destroy()}catch(e){}
  rend=eb=null;$('epubArea').innerHTML='';
}
async function setFormat(f){
  const my=++tok;fmt=f;
  if(f=='epub')await openEpub(my);
  else{destroyEpub();showView(isMobile()?'scroll':'book');if(view=='book')layout()}
}

/* ---------- opening a book: pull out of shelf, turn, show cover, open ---------- */
const T=(x,y,s,r)=>`perspective(1800px) translate(${x}px,${y}px) scale(${s}) rotateY(${r}deg)`;
async function openBook(b,el){
  const my=++tok;bk=b;fmt='pdf';zoom=1;c=0;pdf=null;N=50;ratio=.7;leaves=[];destroyEpub();
  $('rTitle').textContent=b.title;$('rAuthor').textContent=b.author;
  const rd=$('reader');rd.hidden=false;requestAnimationFrame(()=>rd.classList.add('on'));
  const saved=(load()[b.id]||{}).page||1,mobile=isMobile();
  let g,r;
  if(!mobile){
    r=el.getBoundingClientRect();g=el.cloneNode(true);g.className='spine ghost';
    Object.assign(g.style,{left:r.left+'px',top:r.top+'px',width:r.width+'px',height:r.height+'px'});
    document.body.appendChild(g);el.style.visibility='hidden';
    g.animate([{transform:T(0,0,1,0)},{transform:T(0,-14,1.05,0)}],{duration:350,easing:'ease-out',fill:'forwards'});
  }
  const wait=new Promise(res=>setTimeout(res,370));
  try{pdf=await pdfjsLib.getDocument(b.pdf).promise;N=pdf.numPages;const v=(await pdf.getPage(1)).getViewport({scale:1});ratio=v.width/v.height}catch(e){pdf=null}
  await wait;
  if(my!=tok){g&&g.remove();return}
  $('tot').textContent=N;
  if(mobile){buildScroll(saved);showView('scroll');return}
  buildBook();showView('book');layout();
  const bookEl=$('book');bookEl.style.visibility='hidden';
  const sr=$('spread').getBoundingClientRect();
  await Promise.all([ensure(),g.animate([{transform:T(0,-14,1.05,0)},{transform:T(sr.left+sr.width/2-r.left-r.width/2,sr.top+sr.height/2-r.top-r.height/2,H/r.height,-90)}],{duration:750,easing:'ease-in',fill:'forwards'}).finished]);
  if(my!=tok){g.remove();return}
  g.remove();bookEl.style.visibility='visible';
  await bookEl.animate([{transform:`translateX(${-BW/2}px) rotateY(90deg)`},{transform:`translateX(${-BW/2}px) rotateY(0deg)`}],{duration:550,easing:'ease-out'}).finished;
  if(my!=tok)return;
  setTimeout(()=>{if(my==tok)go(Math.floor((saved-1)/2)||1)},300);
}

function buildBook(){
  const bo=$('book');bo.innerHTML='<div class="stack"></div>';bo.style.transform='';
  L=Math.ceil(N/2);leaves=[];
  for(let k=0;k<L;k++){
    const l=document.createElement('div');l.className='leaf'+(k?'':' cover');l.style.zIndex=L-k;
    l.innerHTML='<div class="face fr"><canvas></canvas></div><div class="face b"><canvas></canvas></div>';
    bo.appendChild(l);leaves.push(l);
  }
  $('sl').max=L;$('sl').value=0;c=0;
}

function layout(){
  const s=$('stage'),cx=(s.scrollLeft+s.clientWidth/2)/(s.scrollWidth||1),cy=(s.scrollTop+s.clientHeight/2)/(s.scrollHeight||1);
  const aw=s.clientWidth-130,ah=s.clientHeight-40;
  H=Math.max(200,Math.min(ah,aw/2/ratio));W=H*ratio;BW=W*zoom;
  const st=$('spread').style;st.setProperty('--W',BW+'px');st.setProperty('--H',H*zoom+'px');
  $('zl').textContent=Math.round(zoom*100)+'%';s.classList.toggle('pan',zoom>1);
  shift();
  s.scrollLeft=cx*s.scrollWidth-s.clientWidth/2;s.scrollTop=cy*s.scrollHeight-s.clientHeight/2;
}
function shift(){
  if(!leaves.length)return;
  $('book').style.transform=c==0?`translateX(${-BW/2}px)`:c==L?`translateX(${BW/2}px)`:'none';
}
function setZoom(z){zoom=Math.max(.75,Math.min(3,Math.round(z*100)/100));if(view=='book')layout()}

/* ---------- page rendering ---------- */
async function draw(cv,n,px){
  if(!cv||cv.dataset.d)return;cv.dataset.d=1;
  const x=cv.getContext('2d');
  if(!pdf||n<1||n>N){
    cv.width=Math.round(px);cv.height=Math.round(px/ratio);
    const cover=n==1&&!pdf;
    x.fillStyle=cover?bk.c:'#f6f1e4';x.fillRect(0,0,cv.width,cv.height);
    if(!pdf&&n>=1&&n<=N){x.fillStyle=cover?bk.t:'#a89a7a';x.textAlign='center';x.font=`${px/14}px Cinzel,serif`;x.fillText(cover?bk.title:n,cv.width/2,cv.height/2)}
    return;
  }
  try{
    const p=await pdf.getPage(n),v=p.getViewport({scale:1}),vp=p.getViewport({scale:px/v.width});
    cv.width=vp.width;cv.height=vp.height;
    await p.render({canvasContext:x,viewport:vp}).promise;
  }catch(e){delete cv.dataset.d}
}
function ensure(){
  const px=Math.min(2200,Math.round(W*2.5)),jobs=[];
  for(let k=c-2;k<=c+2;k++){const l=leaves[k];if(l){const cs=l.querySelectorAll('canvas');jobs.push(draw(cs[0],2*k+1,px),draw(cs[1],2*k+2,px))}}
  return Promise.all(jobs);
}
function go(n){
  if(!leaves.length)return;
  c=Math.max(0,Math.min(L,n));
  leaves.forEach((l,k)=>{l.classList.toggle('f',k<c);l.style.zIndex=k<c?k:L-k});
  shift();ensure();
  $('sl').value=c;
  $('cur').textContent=c==0?1:c==L?`${Math.min(2*c,N)}`:`${2*c}–${Math.min(2*c+1,N)}`;
  save(bk.id,Math.min(2*c+1,N));
}

/* mobile: vertical scroll of the PDF */
function buildScroll(saved){
  const s=$('scroll');s.innerHTML='';showView('scroll');
  const w=Math.min(s.clientWidth-16,900),io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)draw(e.target,+e.target.dataset.n,w*2)}),{root:s,rootMargin:'800px'});
  for(let n=1;n<=N;n++){const cv=document.createElement('canvas');cv.dataset.n=n;cv.style.width=w+'px';cv.style.height=w/ratio+'px';s.appendChild(cv);io.observe(cv)}
  s.scrollTop=(saved-1)*(s.scrollHeight/N);
  s.onscroll=()=>{const p=Math.min(N,Math.round(s.scrollTop/(s.scrollHeight/N))+1);$('cur').textContent=p;save(bk.id,p)};
  $('cur').textContent=saved;
}

/* ---------- EPUB ---------- */
async function openEpub(my){
  showView('epub');destroyEpub();
  const area=$('epubArea'),toc=$('toc');toc.innerHTML='';
  try{
    if(typeof ePub=='undefined')throw 0;
    eb=ePub(bk.epub);
    rend=eb.renderTo(area,{width:'100%',height:'100%',flow:'scrolled',allowScriptedContent:true});
    rend.themes.default({body:{background:'#fff !important',color:'#18181b !important','font-family':'Inter,sans-serif !important','line-height':'1.6 !important',padding:(isMobile()?'10px':'20px')+' !important','overflow-x':'hidden !important'},img:{'max-width':'100% !important',height:'auto !important'}});
    await eb.ready;
    if(my!=tok)return;
    const target=((((load()[bk.id]||{}).page)||1)-1)/(N||1);
    eb.locations.generate(1000).then(()=>{if(my==tok)rend.display(eb.locations.cfiFromPercentage(target)||undefined)}).catch(()=>{if(my==tok)rend.display()});
    rend.on('relocated',l=>{
      if(my!=tok||!l||!l.start||!eb.locations.length())return;
      const pct=eb.locations.percentageFromCfi(l.start.cfi);
      if(pct!=null){const p=Math.max(1,Math.min(N,Math.round(pct*N)+1));$('cur').textContent=p;save(bk.id,p)}
    });
    const nav=await eb.loaded.navigation;
    if(my!=tok)return;
    const add=(label,href)=>{const b=document.createElement('button');b.textContent=label;b.onclick=()=>{rend.display(href);$('side').classList.remove('open')};toc.appendChild(b)};
    add('Cover / start',eb.spine.get(0)?eb.spine.get(0).href:0);
    (nav.toc||[]).forEach(ch=>add(ch.label.trim()||'Untitled chapter',ch.href));
  }catch(e){
    area.innerHTML=`<p style="padding:80px 20px;text-align:center;color:#7a3a10">Couldn't load ${bk.epub}. Check that the file is uploaded next to index.html.</p>`;
  }
}

/* ---------- misc ---------- */
function closeReader(){
  tok++;const rd=$('reader');rd.classList.remove('on');rd.hidden=true;
  document.querySelectorAll('.ghost').forEach(g=>g.remove());
  destroyEpub();leaves=[];$('book').innerHTML='';$('scroll').innerHTML='';
  if(document.fullscreenElement&&document.fullscreenElement!==document.documentElement)document.exitFullscreen().catch(()=>{});
  renderShelf();
}
function toggleFS(el){document.fullscreenElement?document.exitFullscreen():el.requestFullscreen().catch(()=>{})}

document.addEventListener('keydown',e=>{
  if($('reader').hidden)return;
  if(e.key=='Escape'&&!document.fullscreenElement)closeReader();
  if(view!='book')return;
  if(e.key=='ArrowRight'||e.key=='PageDown')go(c+1);
  else if(e.key=='ArrowLeft'||e.key=='PageUp')go(c-1);
  else if(e.key=='+'||e.key=='=')setZoom(zoom+.25);
  else if(e.key=='-')setZoom(zoom-.25);
  else if(e.key=='0')setZoom(1);
});

/* drag to pan when zoomed; click a page (at 100%) to turn it */
let dr=null;const stage=$('stage');
stage.addEventListener('pointerdown',e=>{if(!e.target.closest('button'))dr={x:e.clientX,y:e.clientY,l:stage.scrollLeft,t:stage.scrollTop,m:0}});
addEventListener('pointermove',e=>{if(!dr)return;const dx=e.clientX-dr.x,dy=e.clientY-dr.y;dr.m=Math.max(dr.m,Math.abs(dx)+Math.abs(dy));stage.scrollLeft=dr.l-dx;stage.scrollTop=dr.t-dy});
addEventListener('pointerup',e=>{
  if(dr&&dr.m<6&&zoom==1&&view=='book'&&e.target.closest&&e.target.closest('.spread')){const r=$('spread').getBoundingClientRect();go(c+(e.clientX<r.left+r.width/2?-1:1))}
  dr=null;
});
stage.addEventListener('wheel',e=>{if(e.ctrlKey){e.preventDefault();setZoom(zoom+(e.deltaY<0?.25:-.25))}},{passive:false});
addEventListener('resize',()=>{if(!$('reader').hidden&&view=='book')layout()});
document.addEventListener('DOMContentLoaded',renderShelf);
function applyTheme(m){
  document.body.classList.toggle('mc',m);
  document.querySelectorAll('.thTxt').forEach(e=>e.textContent=m?'Classic':'Minecraft');
}
function toggleTheme(){
  const m=!document.body.classList.contains('mc');applyTheme(m);
  try{localStorage.setItem('archive_theme',m?'mc':'classic')}catch(e){}
}
document.addEventListener('DOMContentLoaded',()=>{try{applyTheme(localStorage.getItem('archive_theme')=='mc')}catch(e){}});

</script>
